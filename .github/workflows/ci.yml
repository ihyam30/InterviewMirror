name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: mvn -B -f backend/pom.xml test

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  phase2-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/phase2/*.py
      - run: python scripts/phase2/verify_eval_dataset.py
      - run: python -m unittest discover -s scripts/phase2 -p "test_*.py" -v
      - run: python -m unittest discover -s scripts/poc -p test_score_parser_outputs.py -v

  phase3-interview-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/poc/spring-ai/verify_phase3_dataset.py
      - run: python -m unittest discover -s scripts/poc/spring-ai -p 'test_phase3_dataset.py' -v
      - run: python -m unittest discover -s scripts/poc/spring-ai -p 'test_*review.py' -v

  phase4-report-evaluation-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/phase4/verify_report_eval_dataset.py
      - run: python -m unittest discover -s scripts/phase4 -p 'test_*.py' -v
      - run: python -m py_compile scripts/phase4/*.py

  spring-ai-benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f scripts/poc/spring-ai/pom.xml test

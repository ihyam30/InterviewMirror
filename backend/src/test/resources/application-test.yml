spring:
  datasource:
    url: jdbc:h2:mem:interviewmirror;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  main:
    banner-mode: off
server:
  servlet:
    session:
      cookie:
        secure: false
interviewmirror:
  mineru:
    poll-interval: PT1H
logging:
  level:
    root: WARN

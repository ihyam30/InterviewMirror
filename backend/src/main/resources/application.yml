server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: interviewmirror-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewmirror}
    username: ${DATABASE_USER:interviewmirror}
    password: ${DATABASE_PASSWORD:local-dev-only-change-me}
    hikari:
      maximum-pool-size: 10
  ai:
    model:
      chat: openai
    openai:
      base-url: ${INTERVIEW_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${INTERVIEW_MODEL_API_KEY:disabled}
      chat:
        model: ${INTERVIEW_MODEL_ID:qwen-plus-2025-12-01}
        options:
          temperature: 0.2
      max-retries: 0
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

interviewmirror:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:local-dev-access}
    secret-key: ${S3_SECRET_KEY:local-dev-secret-change-me}
    bucket: ${S3_BUCKET:interviewmirror-private}
  mineru:
    worker-url: ${MINERU_WORKER_URL:http://host.docker.internal:8765}
    worker-token: ${MINERU_WORKER_TOKEN:}
    timeout: ${MINERU_REQUEST_TIMEOUT:PT2M}
    poll-interval: ${PARSE_POLL_INTERVAL:PT2S}
    lease: ${PARSE_TASK_LEASE:PT3M}
    worker-id: ${PARSE_WORKER_ID:local-worker-1}
    enabled: ${PARSE_WORKER_ENABLED:true}
  graph:
    enabled: ${LANGGRAPH4J_ENABLED:true}
  model:
    enabled: ${INTERVIEW_MODEL_ENABLED:false}
    provider: ${INTERVIEW_MODEL_PROVIDER:QWEN}
    id: ${INTERVIEW_MODEL_ID:qwen-plus-2025-12-01}
  report:
    worker-enabled: ${REPORT_WORKER_ENABLED:true}
    worker-id: ${REPORT_WORKER_ID:report-worker-local}
    poll-interval: ${REPORT_POLL_INTERVAL:PT2S}
    lease: ${REPORT_TASK_LEASE:PT5M}
    timeout: ${REPORT_MODEL_TIMEOUT:PT180S}
    pdf-font-path: ${PDF_CJK_FONT_PATH:}

logging:
  level:
    root: INFO
    local.interviewmirror.backend: INFO

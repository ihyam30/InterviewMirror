name: interviewmirror-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-interviewmirror}
      POSTGRES_USER: ${DATABASE_USER:-interviewmirror}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-only-change-this-db-password}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    image: interviewmirror/minio-local:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-interviewmirror-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-this-storage-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-interviewmirror}
      DATABASE_USER: ${DATABASE_USER:-interviewmirror}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-only-change-this-db-password}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-interviewmirror-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-only-change-this-storage-password}
      S3_BUCKET: ${S3_BUCKET:-interviewmirror-private}
      DEMO1_PASSWORD: ${DEMO1_PASSWORD:-MirrorDemo1!}
      DEMO2_PASSWORD: ${DEMO2_PASSWORD:-MirrorDemo2!}
      MINERU_WORKER_URL: ${MINERU_WORKER_URL:-http://host.docker.internal:8765}
      MINERU_WORKER_TOKEN: ${MINERU_WORKER_TOKEN:-}
      LANGGRAPH4J_ENABLED: ${LANGGRAPH4J_ENABLED:-true}
      INTERVIEW_MODEL_ENABLED: ${INTERVIEW_MODEL_ENABLED:-false}
      INTERVIEW_MODEL_PROVIDER: ${INTERVIEW_MODEL_PROVIDER:-QWEN}
      INTERVIEW_MODEL_BASE_URL: ${INTERVIEW_MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      INTERVIEW_MODEL_API_KEY: ${INTERVIEW_MODEL_API_KEY:-disabled}
      INTERVIEW_MODEL_ID: ${INTERVIEW_MODEL_ID:-qwen-plus-2025-12-01}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
